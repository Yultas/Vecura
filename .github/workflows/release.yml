name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}
      VECURA_UPDATE_PRIVATE_KEY: ${{ secrets.VECURA_UPDATE_PRIVATE_KEY }}
      VECURA_UPDATE_PUBLIC_KEY: ${{ secrets.VECURA_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Validate signing configuration
        shell: pwsh
        run: |
          if (-not $env:VECURA_UPDATE_PRIVATE_KEY) { throw "VECURA_UPDATE_PRIVATE_KEY secret is required" }
          if (-not $env:VECURA_UPDATE_PUBLIC_KEY) { throw "VECURA_UPDATE_PUBLIC_KEY secret is required" }

      - name: Build application
        shell: pwsh
        run: |
          $ldflags = "-X vecura/internal/api.CurrentVersion=$env:VERSION -X vecura/internal/update.PublicKeyBase64=$env:VECURA_UPDATE_PUBLIC_KEY"
          wails build -platform windows/amd64 -ldflags $ldflags

      - name: Build updater
        shell: pwsh
        run: go build -trimpath -ldflags "-s -w" -o build/bin/updater.exe ./cmd/updater

      - name: Create signed update manifest
        shell: pwsh
        run: |
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:VERSION/Vecura.exe"
          go run ./cmd/release-manifest `
            -file build/bin/Vecura.exe `
            -version $env:VERSION `
            -url $assetUrl `
            -out build/bin/manifest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/Vecura.exe
            build/bin/updater.exe
            build/bin/manifest.json
